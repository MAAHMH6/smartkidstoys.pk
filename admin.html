<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SmartKids Toys</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/admin.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- ========================================
       ADMIN LOGIN SCREEN
       ======================================== -->
  <div id="admin-login-screen" class="admin-login-bg">
    <div class="admin-login-card">
      <div class="admin-login-logo">
        <img src="assets/logo.png" alt="SmartKids Toys" onerror="this.style.display='none'">
        <div style="margin-top:8px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.3rem;color:var(--dark)">SmartKids Toys</div>
      </div>
      <div style="text-align:center;margin-bottom:20px">
        <span class="admin-badge">🔐 Admin Portal</span>
      </div>
      <h1 class="admin-login-title">Admin Login</h1>
      <p class="admin-login-sub">Sign in to manage your store.</p>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="admin-email" type="email" placeholder="admin@smartkidstoys.pk" value="admin@smartkidstoys.pk" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="admin-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="admin-login-error" style="color:var(--red);font-size:0.85rem;text-align:center;margin-bottom:12px;min-height:20px"></div>
      <button class="btn btn-primary btn-full" id="admin-login-btn" onclick="adminLogin()">Login to Dashboard</button>
      <div class="admin-login-footer">
        <a href="index.html">← Back to Store</a>
      </div>
    </div>
  </div>

  <!-- ========================================
       ADMIN PANEL
       ======================================== -->
  <div id="admin-panel" class="admin-layout" style="display:none">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="SmartKids Toys" class="sidebar-brand-img" onerror="this.style.display='none'">
        <div>
          <div class="sidebar-brand-text">SmartKids Toys</div>
          <div class="sidebar-brand-sub">Admin Dashboard</div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Main</div>
        <div class="sidebar-link active" data-section="dashboard" onclick="loadSection('dashboard')">
          <span class="s-icon">📊</span> Dashboard
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Manage</div>
        <div class="sidebar-link" data-section="products" onclick="loadSection('products')">
          <span class="s-icon">📦</span> Products
        </div>
        <div class="sidebar-link" data-section="orders" onclick="loadSection('orders')">
          <span class="s-icon">🛒</span> Orders
          <span class="s-badge" id="pending-orders-badge" style="display:none">0</span>
        </div>
        <div class="sidebar-link" data-section="customers" onclick="loadSection('customers')">
          <span class="s-icon">👥</span> Customers
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-label">Configuration</div>
        <div class="sidebar-link" data-section="settings" onclick="loadSection('settings')">
          <span class="s-icon">⚙️</span> Site Settings
        </div>
      </div>

      <div class="sidebar-section" style="margin-top:8px">
        <div class="sidebar-section-label">Store</div>
        <div class="sidebar-link" onclick="window.open('index.html','_blank')">
          <span class="s-icon">🌐</span> View Store
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-user" onclick="adminLogout()">
          <div class="sidebar-user-avatar">A</div>
          <div>
            <div class="sidebar-user-name" id="admin-user-name">Admin</div>
            <div class="sidebar-user-role" id="admin-user-email">admin@smartkidstoys.pk</div>
          </div>
          <span class="sidebar-logout" title="Logout">⏻</span>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="admin-main">

      <!-- TOPBAR -->
      <header class="admin-topbar">
        <div class="topbar-left">
          <div class="topbar-page-title" id="topbar-page-title">Dashboard</div>
        </div>
        <div class="topbar-right">
          <button class="view-site-btn" onclick="window.open('index.html','_blank')">
            🌐 View Store
          </button>
          <button class="topbar-icon-btn" onclick="adminLogout()" title="Logout">⏻</button>
        </div>
      </header>

      <!-- CONTENT -->
      <div class="admin-content" id="admin-content">
        <div class="page-loader"><div class="spinner"></div></div>
      </div>

    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="admin-toast-container" class="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>

  <style>
    /* Quick admin page-specific overrides */
    .page-loader { display:flex; align-items:center; justify-content:center; padding:80px 20px; }
    .spinner { width:36px; height:36px; border-radius:50%; border:3px solid var(--gray-2); border-top-color:var(--primary); animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes toast-in { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }
  </style>

</body>
</html>
